[build]
# /Brepro 讓連結器以「內容雜湊」取代時間戳，產物才會是可重現的。
# 這顆的重點就是位元組跨版本不變，不可重現的建置會讓這件事無從驗證。
#
# 後面三個是「Hybrid CRT」：vcruntime 靜態連進來，UCRT 照舊動態連到 api-ms-win-crt-*。
# msvc 目標預設動態連結 VCRUNTIME140.dll，而這顆在安裝根目錄，旁邊沒有 current\ 裡附的那幾顆
# VC++ DLL —— 沒裝過 VC++ 可轉散發套件的電腦上，一點捷徑就是「找不到 VCRUNTIME140.dll」。
# UCRT 是 Windows 10 起的系統元件，乾淨的電腦也有。
#
# 不要只留 +crt-static（連 UCRT 也靜態連）：匯入表會只剩 kernel32、user32、ntdll，簽章後 Defender
# 照樣報 Wacatac.C!ml（VirusTotal 1/71，Microsoft 那一格）；Hybrid 簽章後 0/71，跟改之前一樣。
rustflags = [
    "-C", "link-arg=/Brepro",
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/NODEFAULTLIB:libucrt.lib",
    "-C", "link-arg=/DEFAULTLIB:ucrt.lib",
]
