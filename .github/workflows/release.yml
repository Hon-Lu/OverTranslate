# 壓 tag 後自動打包並發成 pre-release。
#
# 只發 pre-release，永遠不會直接成為正式版 —— 一般使用者的更新來源是
# GithubSource(prerelease: false)，看不到標成 pre-release 的 release。
# 要正式發布時，由人到 GitHub 上手動取消勾選 pre-release。
#
# 版號**以 tag 為準**（2.0.0-beta.1 → 2.0.0-beta.1），csproj 的 <Version> 不參與。
# 這是刻意的：測試時常常只想壓一個不同版號的 tag 看打包結果，不該被迫先發一個
# 改版號的 commit。csproj 與 tag 不一致時只警告，不擋。
#
# tag 沿用本倉既有慣例：不加 v 前綴（1.7.0、1.6.1-beta.1，歷來每一個都是如此）。
# v 前綴也接受並在解析時去掉，純粹是防手滑——打錯前綴不該讓整條流程安靜地不動。
#
# 客戶端不看 tag。它讀 Releases API、依 prerelease 旗標選 release、抓 releases.<channel>.json，
# 版號則來自打包時寫進套件的 packVersion。tag 只在這裡有意義：它決定我們餵給 vpk 的版號。
name: 打包並發布 pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版號，不含 v（例如 2.0.0-beta.1）
        required: true
        type: string
  push:
    tags:
      # 數字開頭（本倉慣例）或 v 開頭都收。不用 '*' 是為了讓非版本的 tag
      # ——標記某個 commit、備份用的 tag——不會誤觸發一次 370 MB 的打包。
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安裝 Velopack CLI
        shell: pwsh
        run: |
          # 版本鎖死，與 OverTranslate.csproj 的 Velopack 套件一致。
          # CLI 與 runtime 版本不一致時產出的 delta 可能無法套用。
          dotnet tool install -g vpk --version 1.2.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: 決定版號
        id: ver
        shell: pwsh
        run: |
          # tag 觸發時用 tag 名，手動觸發時用輸入值。兩條路都不看 csproj。
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.version }}' }
          $version = $tag -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) { throw "版號是空的（tag='$tag'）。" }

          # 不是 semver 的話 vpk 會在打包中途才失敗，那時已經燒掉好幾分鐘的 build。
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "版號 '$version' 不是合法的 semver。tag 請用 2.0.0 或 2.0.0-beta.1 的形式。"
          }

          # 只是提醒。tag 與 csproj 不一致完全不影響更新流程（Velopack 認的是 packVersion），
          # 但正式要發的那一版通常會希望兩者一致。
          [xml]$csproj = Get-Content .\src\OverTranslate\OverTranslate.csproj
          $csprojVersion = ($csproj.Project.PropertyGroup.Version | Select-Object -First 1).Trim()
          if ($csprojVersion -ne $version) {
              Write-Warning "tag 版號 '$version' 與 csproj 的 '$csprojVersion' 不一致。打包用 tag 的版號。"
          }

          Write-Host "版號：$version（tag: $tag）"
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "tag=$tag"         | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: 防呆——這個版號是否已經發布過
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同一個版號重壓一次 tag 時，包出來的東西會跟線上某一版同號但內容不同。
          # 那會讓已經更新過的使用者永遠收不到這一版（版號沒變大），而且不會有任何錯誤。
          # 寧可在這裡失敗。
          $target = "OverTranslate-${{ steps.ver.outputs.version }}-full.nupkg"
          $existing = gh api --paginate repos/${{ github.repository }}/releases `
              --jq '.[].assets[].name' 2>$null
          if ($existing -contains $target) {
              throw "版號 ${{ steps.ver.outputs.version }} 已經發布過（找到 $target）。請先調整 csproj 的 <Version>。"
          }
          Write-Host "版號未被使用，繼續。"

      - name: 抓上一版 full 包（產生 delta 用）
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # vpk 需要上一版的 full 包在本地才算得出 delta，而 runner 每次都是全新的。
          # 抓不到就只出 full 包，使用者這一次要下載整包 —— 會變慢，但不該擋住發布，
          # 所以這一步失敗不影響後續。
          New-Item -ItemType Directory -Force -Path .\artifacts\releases | Out-Null
          vpk download github `
              --repoUrl https://github.com/${{ github.repository }} `
              --channel win `
              --outputDir .\artifacts\releases `
              --token $env:GH_TOKEN

      - name: 打包
        shell: pwsh
        run: |
          .\publish-velopack.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 發布 pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dir = '.\artifacts\releases'

          # 逐一指定，不要整個資料夾丟上去 —— 上一步抓下來的「上一版 full 包」也在裡面，
          # 那個線上已經有了，重傳只是浪費 100+ MB。
          $assets = @(
              "$dir\releases.win.json"
              "$dir\OverTranslate-$v-full.nupkg"
              "$dir\OverTranslate-win-Setup.exe"
              "$dir\OverTranslate-win-Portable.zip"
          )
          $delta = "$dir\OverTranslate-$v-delta.nupkg"
          if (Test-Path $delta) { $assets += $delta } else { Write-Warning "沒有 delta，使用者這一版要下載完整包。" }

          foreach ($a in $assets) {
              if (-not (Test-Path $a)) { throw "缺少產物：$a" }
          }

          # 不要用 here-string。它的結尾 "@ 必須頂在行首，而這整段是 YAML 的 run: | 區塊，
          # 行首沒有縮排就會把 block scalar 截斷，整個 workflow 檔變成無效 YAML
          # ——症狀是每次 push 都產生一個 0 秒就失敗的 run，連 tag 觸發都不會執行。
          # 骨架先寫好，只留下這一版真正改了什麼要填。TODO 是刻意會被算繪出來的：
          # 用 HTML 註解當佔位符的話，忘了填就是安安靜靜發出一則空的更新說明。
          $notes = @(
              '## 🌐 Select your language'
              ''
              '<details>'
              '<summary><b>English</b></summary>'
              ''
              "# OverTranslate $v"
              ''
              '## ◆ TODO'
              '- TODO'
              ''
              '## ◇ Other improvements'
              '- TODO'
              ''
              '## ↓ Install / Update'
              '- **New users**: download `OverTranslate-win-Setup.exe` to install, or use the portable `OverTranslate-win-Portable.zip`; both update automatically'
              '- **Existing users**: the app updates itself; if the automatic update is slow, an installed copy can download and run `OverTranslate-win-Setup.exe` again, and a portable copy can download `OverTranslate-win-Portable.zip` and overwrite the old files'
              ''
              '</details>'
              ''
              '<details>'
              '<summary><b>繁體中文</b></summary>'
              ''
              "# OverTranslate $v"
              ''
              '## ◆ TODO'
              '- TODO'
              ''
              '## ◇ 其他改善'
              '- TODO'
              ''
              '## ↓ 安裝 / 更新'
              '- **新使用者**：可下載 `OverTranslate-win-Setup.exe` 安裝，或使用 `OverTranslate-win-Portable.zip` 免安裝版本；兩者皆支援自動更新'
              '- **現有使用者**：程式支援自動更新；若自動更新較慢，安裝版可重新下載並執行 `OverTranslate-win-Setup.exe` 更新，免安裝版則下載 `OverTranslate-win-Portable.zip` 後直接覆蓋原檔'
              ''
              '</details>'
              ''
              '<details>'
              '<summary><b>简体中文</b></summary>'
              ''
              "# OverTranslate $v"
              ''
              '## ◆ TODO'
              '- TODO'
              ''
              '## ◇ 其他改善'
              '- TODO'
              ''
              '## ↓ 安装 / 更新'
              '- **新用户**：可下载 `OverTranslate-win-Setup.exe` 安装，或使用 `OverTranslate-win-Portable.zip` 免安装版本；两者皆支持自动更新'
              '- **现有用户**：程序支持自动更新；若自动更新较慢，安装版可重新下载并运行 `OverTranslate-win-Setup.exe` 更新，免安装版则下载 `OverTranslate-win-Portable.zip` 后直接覆盖原文件'
              ''
              '</details>'
              ''
              '<details>'
              '<summary><b>日本語</b></summary>'
              ''
              "# OverTranslate $v"
              ''
              '## ◆ TODO'
              '- TODO'
              ''
              '## ◇ その他の改善'
              '- TODO'
              ''
              '## ↓ インストール / アップデート'
              '- **新しくお使いの方**：`OverTranslate-win-Setup.exe` をダウンロードしてインストールするか、インストール不要の `OverTranslate-win-Portable.zip` をお使いください。どちらも自動更新に対応しています'
              '- **既存のユーザー**：本体が自動で更新されます。自動更新が遅いときは、インストール版は `OverTranslate-win-Setup.exe` をもう一度ダウンロードして実行し、ポータブル版は `OverTranslate-win-Portable.zip` をダウンロードして元のファイルに上書きしてください'
              ''
              '</details>'
              ''
              '<details>'
              '<summary><b>한국어</b></summary>'
              ''
              "# OverTranslate $v"
              ''
              '## ◆ TODO'
              '- TODO'
              ''
              '## ◇ 그 밖의 개선'
              '- TODO'
              ''
              '## ↓ 설치 / 업데이트'
              '- **새로 사용하는 분**: `OverTranslate-win-Setup.exe`를 내려받아 설치하거나, 설치가 필요 없는 `OverTranslate-win-Portable.zip`을 사용하세요. 둘 다 자동 업데이트를 지원합니다'
              '- **기존 사용자**: 앱이 자동으로 업데이트됩니다. 자동 업데이트가 느릴 때는 설치 버전은 `OverTranslate-win-Setup.exe`를 다시 내려받아 실행하고, 무설치 버전은 `OverTranslate-win-Portable.zip`을 내려받아 기존 파일에 덮어쓰세요'
              ''
              '</details>'
              ''
              '---'
              ''
              "- commit: ${{ github.sha }}"
              "- 觸發：${{ github.event_name }}"
          ) -join "`n"

          gh release create '${{ steps.ver.outputs.tag }}' `
              --repo ${{ github.repository }} `
              --target ${{ github.sha }} `
              --title $v `
              --notes $notes `
              --prerelease `
              @assets

      - name: 產出清單
        if: always()
        shell: pwsh
        run: Get-ChildItem .\artifacts\releases | Select-Object Name, Length
