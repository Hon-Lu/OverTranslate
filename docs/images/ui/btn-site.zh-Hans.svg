<svg xmlns="http://www.w3.org/2000/svg" width="242" height="58" viewBox="0 0 242 58" role="img" aria-label="前往官方网站">
  <style>
    svg { --bg:#f2f8fd; --line:#a6d0ed; --fg:#0a58a6; --sub:#3d6f97; }
    @media (prefers-color-scheme: dark) { svg { --bg:#10202e; --line:#2f5674; --fg:#58c4fa; --sub:#9cbdd2; } }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .icon { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .out { fill: none; stroke: var(--fg); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .title, .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
    .title { font-size: 14.5px; font-weight: 650; fill: var(--fg); }
    .sub { font-size: 12px; fill: var(--sub); }
